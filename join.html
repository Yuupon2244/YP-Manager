<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>参加型配信 - 参加受付</title>

    <link
        rel="stylesheet"
        href="join.css"
    >

    <link
        rel="stylesheet"
        href="shared-chat.css"
    >
</head>

<body>

<div class="container">

    <h1>
        🎮 参加型配信
    </h1>

    <p class="sub">
        名前を入力して利用方法を選んでください！
    </p>

    <input
        id="nameInput"
        type="text"
        maxlength="30"
        placeholder="名前を入力"
        autocomplete="off"
    >

    <div class="join-choice-buttons">

        <button
            id="joinButton"
            type="button"
        >
            🎮 待機列に参加する
        </button>

        <button
            id="viewerButton"
            type="button"
        >
            💬 チャットのみ利用する
        </button>

    </div>

    <button
        id="cancelButton"
        type="button"
        class="cancel-button hidden"
    >
        参加を辞退する
    </button>

    <div id="message"></div>


    <!-- URL参加者 全体共有チャット -->

    <section
        id="participantChatSection"
        class="shared-chat-panel hidden"
    >

        <div class="shared-chat-title">
            💬 URL参加者 全体共有チャット
        </div>

        <div
            id="participantChatStatus"
            class="shared-chat-note"
        >
            チャットを確認中…
        </div>

        <div
            id="participantChatList"
            class="shared-chat-list"
        ></div>

        <div class="shared-chat-compose">

            <textarea
                id="participantChatInput"
                maxlength="100"
                rows="2"
                placeholder="メッセージを入力（100文字まで）"
            ></textarea>

            <div class="shared-chat-compose-bottom">

                <span id="participantChatCount">
                    0 / 100
                </span>

                <button
                    id="participantChatSendButton"
                    type="button"
                    class="shared-chat-send-button"
                >
                    送信
                </button>

            </div>

        </div>

        <div
            id="participantChatMessage"
            class="shared-chat-feedback"
        ></div>

    </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="join.js"></script>
<script src="participant-chat.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YP-Manager 順番待ちリスト</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
}

#stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    container-type: inline-size;
}

.slot-name {
    position: absolute;
    transform: translateY(-50%);
    color: #ffffff;
    font-family: "Noto Sans JP", "Meiryo", sans-serif;
    font-size: clamp(20px, 3.15cqw, 38px);
    font-weight: 900;
    line-height: 1.1;
    -webkit-text-stroke: 0.5px #111111;
    text-shadow:
        1px 1px 2px #000000,
        -1px -1px 2px #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
}

.left {
    left: 12.3%;
    width: 34%;
    text-align: left;
}

.right {
    left: 59.8%;
    width: 33.5%;
    text-align: left;
}

.row-1 { top: 80.1%; }
.row-2 { top: 85.0%; }
.row-3 { top: 90.0%; }
.row-4 { top: 95.0%; }
</style>
</head>

<body>

<div id="stage">
    <span id="slot1" class="slot-name left row-1"></span>
    <span id="slot2" class="slot-name left row-2"></span>
    <span id="slot3" class="slot-name left row-3"></span>
    <span id="slot4" class="slot-name left row-4"></span>

    <span id="slot5" class="slot-name right row-1"></span>
    <span id="slot6" class="slot-name right row-2"></span>
    <span id="slot7" class="slot-name right row-3"></span>
    <span id="slot8" class="slot-name right row-4"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL =
    "https://ilmiebokwfccybrtduxy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tl-vkXmtiYn_f1VtPy689A_dwKCdYg5";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const stage =
    document.getElementById("stage");

const slotElements =
    Array.from(
        { length: 8 },
        (_, index) =>
            document.getElementById(`slot${index + 1}`)
    );

let polling = false;


/* =====================================
   表示をクリア
===================================== */

function clearNames() {
    for (const element of slotElements) {
        element.textContent = "";
        element.title = "";
    }
}


/* =====================================
   チャット専用利用者を除外
===================================== */

function isChatOnlyPerson(person) {
    const status = String(person?.status || "").toLowerCase();
    const lobbyState = String(person?.lobby_state || "").toLowerCase();
    const source = String(person?.source || "").toLowerCase();
    const note = String(person?.note || "").toLowerCase();

    return (
        person?.chat_only === true ||
        person?.chat_only === "true" ||
        status === "chat_only" ||
        status === "viewer" ||
        lobbyState === "chat_only" ||
        source === "chat" ||
        note === "chat_only" ||
        note === "viewer"
    );
}


/* =====================================
   メイン待機列に載せる人か判定
   参加中・観戦中・待機部屋所属者は除外
===================================== */

function hasRoomAssignment(person) {
    const roomId = person?.room_id;

    return (
        roomId !== null &&
        roomId !== undefined &&
        String(roomId).trim() !== ""
    );
}

function isMainWaitingPerson(person) {
    if (
        !person ||
        isChatOnlyPerson(person) ||
        hasRoomAssignment(person)
    ) {
        return false;
    }

    const status =
        String(person.status || "").toLowerCase().trim();

    const lobbyState =
        String(person.lobby_state || "").toLowerCase().trim();

    const inactiveStatuses = new Set([
        "playing",
        "watching",
        "viewer",
        "chat_only",
        "finished",
        "cancelled",
        "canceled",
        "removed",
        "left",
        "exchange",
        "in_game"
    ]);

    if (
        inactiveStatuses.has(status) ||
        inactiveStatuses.has(lobbyState)
    ) {
        return false;
    }

    // 通常の待機者は status=waiting。
    // 旧データでは lobby_state=waiting も利用する。
    return (
        status === "waiting" ||
        lobbyState === "waiting"
    );
}


/* =====================================
   表示名の決定（ハイブリッド方式）

   スプラ名あり：
       スプラ名を表示

   URL参加・手動追加：
       登録された名前を表示

   コメント参加・スプラ名未登録：
       YouTube表示名を「仮：名前」で表示

   表示名自体が空：
       利用可能なIDを仮表示

   長い名前：
       CSSの省略表示で枠内に収める
===================================== */

function firstNonEmpty(values) {
    for (const value of values) {
        if (value === null || value === undefined) {
            continue;
        }

        const text = String(value).trim();

        if (text) {
            return text;
        }
    }

    return "";
}

function getQueueDisplayName(person) {
    if (!person) {
        return "";
    }

    const gameName = firstNonEmpty([
        person.game_name,
        person.splatoon_name,
        person.ink_name
    ]);

    // スプラ名があれば最優先。
    if (gameName) {
        return gameName;
    }

    const source =
        String(person.source || "").toLowerCase().trim();

    // データベースに入っている候補名を順番に確認。
    const originalName = firstNonEmpty([
        person.name,
        person.display_name,
        person.youtube_name,
        person.youtube_display_name,
        person.user_display_name,
        person.user_name,
        person.username,
        person.channel_name,
        person.author_name,
        person.nickname
    ]);

    // URL参加・手動追加は従来の名前をそのまま表示。
    if (
        ["url", "manual", "admin", ""].includes(source)
    ) {
        if (originalName) {
            return originalName;
        }
    }

    // コメント参加者は、スプラ名がなくても仮表示する。
    if (originalName) {
        return `仮：${originalName}`;
    }

    // 名前が空でも、IDがあれば完全な空欄にしない。
    const fallbackId = firstNonEmpty([
        person.user_id,
        person.youtube_user_id,
        person.author_id,
        person.channel_id,
        person.id
    ]);

    if (fallbackId) {
        const compactId = fallbackId.length > 12
            ? `${fallbackId.slice(0, 9)}…`
            : fallbackId;

        return `仮：${compactId}`;
    }

    return "仮：名前未登録";
}


/* =====================================
   初参加優先・表示順で並べ替え
===================================== */

function isFirstParticipationPending(person) {
    return (
        person.first_participation_pending === true ||
        person.first_participation_pending === "true" ||
        (
            person.first_participation_pending == null &&
            person.note === "initial"
        )
    );
}

function getValidDisplayOrder(person) {
    const value = person?.display_order;

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number) ? number : null;
}

function sortWaitingPeople(people) {
    return [...people].sort((a, b) => {
        const aNew =
            isFirstParticipationPending(a) ? 0 : 1;

        const bNew =
            isFirstParticipationPending(b) ? 0 : 1;

        if (aNew !== bNew) {
            return aNew - bNew;
        }

        const ao = getValidDisplayOrder(a);
        const bo = getValidDisplayOrder(b);

        if (
            ao !== null &&
            bo !== null &&
            ao !== bo
        ) {
            return ao - bo;
        }

        if (ao !== null && bo === null) {
            return -1;
        }

        if (ao === null && bo !== null) {
            return 1;
        }

        return String(a.joined_at || "").localeCompare(
            String(b.joined_at || "")
        );
    });
}


/* =====================================
   現在の配信IDを取得
===================================== */

async function getCurrentSessionId() {
    const { data, error } =
        await supabaseClient
            .from("app_settings")
            .select("value")
            .eq("key", "current_session_id")
            .maybeSingle();

    if (error) {
        throw error;
    }

    if (!data || !data.value) {
        return null;
    }

    return String(data.value).trim();
}


/* =====================================
   配信表示 ON / OFF を取得
===================================== */

async function getDisplayEnabled() {
    const { data, error } =
        await supabaseClient
            .from("app_settings")
            .select("value")
            .eq("key", "stream_queue_visible")
            .maybeSingle();

    if (error) {
        throw error;
    }

    // 設定がない場合は表示ON。
    if (!data) {
        return true;
    }

    return !(
        data.value === false ||
        data.value === "false" ||
        data.value === 0
    );
}


/* =====================================
   待機リスト更新

   session_id が一致する参加者を取得し、
   画面側でメイン待機者を判定する。

   status=waiting だけに絞って取得しないことで、
   lobby_state=waiting の旧データも判定対象にする。
===================================== */

async function refreshQueue() {
    if (polling) {
        return;
    }

    polling = true;

    try {
        const enabled =
            await getDisplayEnabled();

        stage.style.display =
            enabled ? "block" : "none";

        if (!enabled) {
            clearNames();
            return;
        }

        const sessionId =
            await getCurrentSessionId();

        if (!sessionId) {
            clearNames();
            return;
        }

        const { data, error } =
            await supabaseClient
                .from("participants")
                .select("*")
                .eq("session_id", sessionId);

        if (error) {
            throw error;
        }

        const waitingPeople =
            (data || []).filter(
                isMainWaitingPerson
            );

        const sortedPeople =
            sortWaitingPeople(waitingPeople);

        // 先頭から8人を表示。
        for (
            let i = 0;
            i < slotElements.length;
            i++
        ) {
            const person =
                sortedPeople[i];

            const displayName = person
                ? getQueueDisplayName(person)
                : "";

            slotElements[i].textContent =
                displayName;

            slotElements[i].title =
                displayName;
        }

        console.debug(
            "[YP-Manager Queue]",
            `取得=${(data || []).length}`,
            `メイン待機=${waitingPeople.length}`,
            `表示=${Math.min(
                sortedPeople.length,
                slotElements.length
            )}`
        );

    } catch (error) {
        console.error(
            "[YP-Manager Queue] 待機リスト更新エラー:",
            error
        );

    } finally {
        polling = false;
    }
}


/* =====================================
   起動・自動更新
===================================== */

refreshQueue();

setInterval(
    refreshQueue,
    2500
);
</script>
</body>
</html>

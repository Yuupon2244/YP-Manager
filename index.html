<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YP-Manager v1.1</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="shared-chat.css"
    >

</head>


<body>


<!-- URL参加者の一時通知 -->
<div
    id="urlJoinNotification"
    class="url-join-notification"
    role="status"
    aria-live="polite"
>
</div>


<div class="container">


    <!-- ================================= -->
    <!-- タイトル -->
    <!-- ================================= -->

    <h1>
        🎮 YP-Manager
    </h1>


    <p class="subtitle">
        参加型待機列管理 v1.1
    </p>


    <p
        id="sessionStatus"
        class="subtitle"
    >
        現在の配信を確認中…
    </p>



    <!-- ================================= -->
    <!-- 再参加受付 -->
    <!-- ================================= -->

    <div
        id="rejoinArea"
        style="
            margin: 16px 0 22px;
            padding: 14px;
            background: #363636;
            border-radius: 12px;
            text-align: center;
        "
    >

        <div
            style="
                font-size: 14px;
                color: #bbb;
                margin-bottom: 8px;
            "
        >
            2試合終了後の再参加
        </div>


        <button
            id="rejoinToggle"
            type="button"
            style="
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 9px;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
            "
        >
            読み込み中…
        </button>

    </div>



    <!-- ================================= -->
    <!-- 部屋管理 -->
    <!-- ================================= -->

    <section
        id="roomManagementSection"
        style="
            margin-bottom: 28px;
        "
    >


        <h2>
            🏠 部屋管理
        </h2>


        <div
            style="
                background: #333;
                border-radius: 14px;
                padding: 16px;
                margin-bottom: 14px;
            "
        >


            <div
                style="
                    font-size: 14px;
                    color: #bbb;
                    margin-bottom: 10px;
                "
            >
                視聴者用の待機部屋を作成できます
            </div>


            <div
                style="
                    display: flex;
                    gap: 8px;
                    flex-wrap: wrap;
                "
            >


                <input
                    id="roomNameInput"
                    type="text"
                    maxlength="30"
                    placeholder="部屋名 例：待機部屋A"
                    autocomplete="off"
                    style="
                        flex: 1;
                        min-width: 180px;
                        padding: 11px 12px;
                        border: none;
                        border-radius: 8px;
                        font-size: 15px;
                    "
                >


                <input
                    id="moderatorNameInput"
                    type="text"
                    maxlength="30"
                    placeholder="管理者名"
                    autocomplete="off"
                    style="
                        flex: 1;
                        min-width: 150px;
                        padding: 11px 12px;
                        border: none;
                        border-radius: 8px;
                        font-size: 15px;
                    "
                >


                <button
                    id="createRoomButton"
                    type="button"
                    style="
                        padding: 11px 18px;
                        border: none;
                        border-radius: 8px;
                        background: #39b54a;
                        color: white;
                        font-size: 15px;
                        font-weight: bold;
                        cursor: pointer;
                    "
                >
                    ＋ 待機部屋を作成
                </button>


            </div>

        </div>



        <!-- 部屋一覧 -->

        <div
            id="roomList"
        >


            <div
                class="person"
                id="roomLoading"
            >
                部屋情報を読み込み中…
            </div>


        </div>


    </section>



    <!-- ================================= -->
    <!-- 手動追加 -->
    <!-- ================================= -->

    <div class="input-area">

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="参加者名を入力"
            autocomplete="off"
        >


        <button
            id="addButton"
            type="button"
        >
            追加
        </button>

    </div>



    <!-- ================================= -->
    <!-- 待機中 -->
    <!-- ================================= -->

    <section>

        <h2>
            🟡 待機中
        </h2>


        <div id="waitingList">
        </div>

    </section>



    <!-- ================================= -->
    <!-- 参加中 -->
    <!-- ================================= -->

    <section>

<h2>
    🟢 参加中
</h2>


<div class="buttons">

    <button
        id="finishAllPlayingButton"
        type="button"
        class="finish"
    >
        🔁 参加中の全員を2試合終了
    </button>

</div>


<div id="playingList">
</div>

    </section>



    <!-- ================================= -->
    <!-- 終了 -->
    <!-- ================================= -->

    <section>

        <h2>
            ⚪ 終了
        </h2>


        <div id="finishedList">
        </div>

    </section>



    <!-- ================================= -->
    <!-- 辞退 -->
    <!-- ================================= -->

    <section>

        <h2>
            🔴 辞退
        </h2>


        <div id="cancelledList">
        </div>

    </section>


<!-- ================================= -->
<!-- URL参加者 全体共有チャット -->
<!-- ================================= -->

<section
    id="sharedChatViewer"
    class="shared-chat-panel shared-chat-viewer"
>

    <div class="shared-chat-title">
        💬 URL参加者 全体共有チャット
    </div>

    <div
        id="sharedChatStatus"
        class="shared-chat-note"
    >
        チャットを確認中…
    </div>

    <div
        id="sharedChatList"
        class="shared-chat-list"
    ></div>

</section>


</div>

</div>



<!-- ================================= -->
<!-- Supabase -->
<!-- ================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<!-- ================================= -->
<!-- YP-Manager -->
<!-- ================================= -->

<script src="script.js"></script>

<!-- 部屋管理 -->
<script src="rooms.js"></script>

<!-- 管理者認証 -->
<script src="auth.js"></script>

<!-- リセット -->
<script src="reset.js"></script>

<!-- Moderator招待 -->
<script src="invites.js"></script>

<!-- URL参加者チャット閲覧 -->
<script src="chat-viewer.js"></script>

</body>

</html>

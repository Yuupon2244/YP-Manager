<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0"

    <title>YP-Manager v1.3.0</title>

</head>

<body>

<!-- URL参加者の一時通知 -->
<div
    id="urlJoinNotification"
    class="url-join-notification"
    role="status"
    aria-live="polite"
></div>

<div class="container">

    <!-- タイトル -->
    <h1>🎮 YP-Manager</h1>

    <p class="subtitle">
        参加型待機列管理 v1.3.0
    </p>

    <p
        id="sessionStatus"
        class="subtitle"
    >
        現在の配信を確認中…
    </p>

    <!-- ================================= -->
    <!-- 配信画面の順番待ちリスト表示 -->
    <!-- ================================= -->

    <div
        id="queueDisplayArea"
        style="
            margin: 16px 0 22px;
            padding: 14px;
            background: #363636;
            border-radius: 12px;
            text-align: center;
        "
    >

        <div
            style="
                font-size: 15px;
                font-weight: bold;
                color: #fff;
                margin-bottom: 6px;
            "
        >
            📺 配信画面の順番待ちリスト
        </div>

        <div
            style="
                font-size: 13px;
                color: #bbb;
                margin-bottom: 10px;
            "
        >
            OBSに表示する順番待ちリストを切り替えます
        </div>

        <button
            id="queueDisplayToggle"
            type="button"
            style="
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 9px;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
            "
        >
            設定を読み込み中…
        </button>

        <p
            id="queueDisplayStatus"
            style="
                font-size: 12px;
                color: #bbb;
                margin: 10px 0 0;
            "
        >
            設定を確認しています
        </p>

    </div>

    <!-- ================================= -->
    <!-- 再参加受付 -->
    <!-- ================================= -->

    <div
        id="rejoinArea"
        style="
            margin: 16px 0 22px;
            padding: 14px;
            background: #363636;
            border-radius: 12px;
            text-align: center;
        "
    >

        <div
            style="
                font-size: 14px;
                color: #bbb;
                margin-bottom: 8px;
            "
        >
            2試合終了後の再参加
        </div>

        <button
            id="rejoinToggle"
            type="button"
            style="
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 9px;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
            "
        >
            読み込み中…
        </button>

    </div>

    <!-- ================================= -->
    <!-- 部屋管理 -->
    <!-- ================================= -->

    <section
        id="roomManagementSection"
        style="margin-bottom: 28px;"
    >

        <h2>🏠 部屋管理</h2>

        <div
            style="
                background: #333;
                border-radius: 14px;
                padding: 16px;
                margin-bottom: 14px;
            "
        >

            <div
                style="
                    font-size: 14px;
                    color: #bbb;
                    margin-bottom: 10px;
                "
            >
                視聴者用の待機部屋を作成できます
            </div>

            <div
                style="
                    display: flex;
                    gap: 8px;
                    flex-wrap: wrap;
                "
            >

                <input
                    id="roomNameInput"
                    type="text"
                    maxlength="30"
                    placeholder="部屋名 例：待機部屋A"
                    autocomplete="off"
                    style="
                        flex: 1;
                        min-width: 180px;
                        padding: 11px 12px;
                        border: none;
                        border-radius: 8px;
                        font-size: 15px;
                    "
                >

                <input
                    id="moderatorNameInput"
                    type="text"
                    maxlength="30"
                    placeholder="管理者名"
                    autocomplete="off"
                    style="
                        flex: 1;
                        min-width: 150px;
                        padding: 11px 12px;
                        border: none;
                        border-radius: 8px;
                        font-size: 15px;
                    "
                >

                <button
                    id="createRoomButton"
                    type="button"
                    style="
                        padding: 11px 18px;
                        border: none;
                        border-radius: 8px;
                        background: #39b54a;
                        color: white;
                        font-size: 15px;
                        font-weight: bold;
                        cursor: pointer;
                    "
                >
                    ＋ 待機部屋を作成
                </button>

            </div>

        </div>

        <!-- 部屋一覧 -->
        <div id="roomList">

            <div
                class="person"
                id="roomLoading"
            >
                部屋情報を読み込み中…
            </div>

        </div>

    </section>

    <!-- ================================= -->
    <!-- 手動追加 -->
    <!-- ================================= -->

    <div class="input-area">

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="参加者名を入力"
            autocomplete="off"
        >

        <button
            id="addButton"
            type="button"
        >
            追加
        </button>

    </div>

    <!-- ================================= -->
    <!-- 待機中 -->
    <!-- ================================= -->

    <section>

        <h2>🟡 待機中</h2>

        <div id="waitingList"></div>

    </section>

    <!-- ================================= -->
    <!-- 参加中 -->
    <!-- ================================= -->

    <section>

        <h2>🟢 参加中</h2>

        <div class="buttons">

            <button
                id="finishAllPlayingButton"
                type="button"
                class="finish"
            >
                🔁 参加中の全員を2試合終了
            </button>

        </div>

        <div id="playingList"></div>

    </section>

    <!-- ================================= -->
    <!-- 終了履歴（処理用・画面では非表示） -->
    <!-- ================================= -->

    <section style="display: none;">

        <div id="finishedList"></div>

    </section>

    <!-- ================================= -->
    <!-- 辞退 -->
    <!-- ================================= -->

    <section>

        <h2>🔴 辞退</h2>

        <div id="cancelledList"></div>

    </section>

    <!-- ================================= -->
    <!-- チャットのみ利用者 -->
    <!-- ================================= -->

    <section>

        <h2>💬 チャット利用者</h2>

        <div id="chatViewerList"></div>

    </section>

    <!-- ================================= -->
    <!-- URL参加者 全体共有チャット -->
    <!-- ================================= -->

    <section
        id="sharedChatViewer"
        class="shared-chat-panel shared-chat-viewer"
    >

        <div class="shared-chat-title">
            💬 URL参加者 全体共有チャット
        </div>

        <div
            id="sharedChatStatus"
            class="shared-chat-note"
        >
            チャットを確認中…
        </div>

        <div
            id="sharedChatList"
            class="shared-chat-list"
        ></div>

    </section>

</div>

<!-- ================================= -->
<!-- 配信待機リスト ON / OFF -->
<!-- ================================= -->

<script>
"use strict";

const queueDisplayToggleButton =
    document.getElementById(
        "queueDisplayToggle"
    );

const queueDisplayStatusText =
    document.getElementById(
        "queueDisplayStatus"
    );

let queueDisplayEnabled = true;

let queueDisplayBusy = false;


/* ボタンの見た目を更新 */
function renderQueueDisplayButton() {

    if (queueDisplayEnabled) {

        queueDisplayToggleButton.textContent =
            "📺 順番待ちリスト表示 ON";

        queueDisplayToggleButton.style.background =
            "#39b54a";

        queueDisplayToggleButton.style.color =
            "#ffffff";

        queueDisplayStatusText.textContent =
            "配信画面に順番待ちリストを表示します";

    } else {

        queueDisplayToggleButton.textContent =
            "📺 順番待ちリスト表示 OFF";

        queueDisplayToggleButton.style.background =
            "#555555";

        queueDisplayToggleButton.style.color =
            "#ffffff";

        queueDisplayStatusText.textContent =
            "配信画面の順番待ちリストを非表示にします";

    }

}


/* 保存済み設定を読み込む */
async function loadQueueDisplaySetting() {

    queueDisplayToggleButton.disabled = true;

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("app_settings")
            .select("value")
            .eq("key", "stream_queue_visible")
            .maybeSingle();


        if (error) {
            throw error;
        }


        /*
         * 設定が存在しなければ初期状態はON。
         * 実際の保存形式は既存の設定に合わせて文字列を使う。
         */
        if (!data) {

            queueDisplayEnabled = true;

        } else {

            queueDisplayEnabled =
                String(data.value) === "true";

        }


        renderQueueDisplayButton();

    } catch (error) {

        console.error(
            "順番待ちリスト表示設定の取得エラー:",
            error
        );

        queueDisplayStatusText.textContent =
            "設定の読み込みに失敗しました。通信を確認してください。";

        queueDisplayToggleButton.textContent =
            "再読み込みしてください";

    } finally {

        queueDisplayToggleButton.disabled = false;

    }

}


/* ON / OFFを切り替えてSupabaseに保存 */
async function toggleQueueDisplaySetting() {

    if (queueDisplayBusy) {
        return;
    }

    queueDisplayBusy = true;

    queueDisplayToggleButton.disabled = true;

    queueDisplayToggleButton.textContent =
        "変更を保存中…";


    const newValue =
        !queueDisplayEnabled;


    try {

        const {
            error
        } = await supabaseClient
            .from("app_settings")
            .upsert(
                {
                    key: "stream_queue_visible",

                    value: String(newValue),

                    updated_at:
                        new Date().toISOString()
                },
                {
                    onConflict: "key"
                }
            );


        if (error) {
            throw error;
        }


        queueDisplayEnabled = newValue;

        renderQueueDisplayButton();

    } catch (error) {

        console.error(
            "順番待ちリスト表示設定の保存エラー:",
            error
        );

        alert(
            "表示設定を保存できませんでした。\n通信状態やSupabaseの設定を確認してください。"
        );

        queueDisplayStatusText.textContent =
            "保存に失敗しました。設定は変更されていません。";

        renderQueueDisplayButton();

    } finally {

        queueDisplayBusy = false;

        queueDisplayToggleButton.disabled = false;

    }

}


queueDisplayToggleButton.addEventListener(
    "click",
    toggleQueueDisplaySetting
);


loadQueueDisplaySetting();

</script>

</body>
</html>

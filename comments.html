
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>YP-Manager コメント閲覧専用</title>
<style>
:root {
    color-scheme: dark;
    --bg: #17191d;
    --panel: #22252b;
    --card: #2b2f37;
    --line: #3a404a;
    --text: #f4f6f8;
    --muted: #abb3bf;
    --blue: #7bd8ff;
    --gold: #ffd66b;
    --green: #83e1a0;
    --red: #ff9292;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans JP", Meiryo, sans-serif;
}
button, input { font: inherit; }
button, a.button {
    min-height: 42px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #343943;
    color: var(--text);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
}
button:hover, a.button:hover { background: #414753; }
button:disabled { opacity: .55; cursor: wait; }
#app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 15px 20px;
    border-bottom: 1px solid var(--line);
    background: #202329;
}
.header-main { min-width: 0; }
h1 { margin: 0; font-size: clamp(20px, 2.6vw, 30px); line-height: 1.25; }
.subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
#status {
    flex: 0 0 auto;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
}
#status[data-kind="error"] { color: var(--red); }
#status[data-kind="ok"] { color: var(--green); }
#messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px clamp(10px, 2vw, 24px) 26px;
    scroll-behavior: smooth;
}
.message {
    margin: 0 auto 10px;
    padding: 12px 15px;
    max-width: 1300px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
}
.message.owner { background: #443653; border-color: #7958a4; }
.message.room-admin { background: #293d4a; border-color: #4b91ae; }
.message.moderator { background: #303b31; border-color: #536c55; }
.message.deleted { opacity: .7; border-style: dashed; }
.message-meta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.message-name { min-width: 0; color: var(--blue); font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
.message.owner .message-name { color: var(--gold); }
.message.room-admin .message-name { color: #8fe3ff; }
.message.moderator .message-name { color: var(--green); }
.message-time { flex: 0 0 auto; margin-left: auto; color: var(--muted); font-size: 12px; }
.message-text { font-size: clamp(16px, 1.6vw, 20px); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.message-image { display: block; max-width: min(100%, 720px); max-height: 440px; margin-top: 10px; object-fit: contain; object-position: left top; border-radius: 8px; cursor: zoom-in; }
.deleted-note { margin-top: 6px; color: var(--muted); font-size: 12px; }
.empty { display: grid; place-items: center; min-height: 180px; color: var(--muted); font-size: 16px; }
footer { flex: 0 0 auto; padding: 8px 18px; border-top: 1px solid var(--line); color: #838b97; font-size: 12px; text-align: center; }
#loginOverlay {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    padding: 20px; background: rgba(13, 14, 17, .97);
}
.login-card { width: min(100%, 430px); padding: 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
.login-card h2 { margin: 0 0 8px; font-size: 25px; }
.login-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
.login-card label { display: block; margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
.login-card input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #17191d; color: var(--text); }
.login-card button { width: 100%; margin-top: 16px; background: #286b49; border-color: #39865f; }
#loginMessage { min-height: 20px; margin-top: 12px; color: var(--red); font-size: 13px; }
#imageOverlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 25px; background: rgba(0,0,0,.88); cursor: zoom-out; }
#imageOverlay img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* URL参加者一覧：コメントとは独立してスクロールできるサイドパネル */
#contentLayout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    flex: 1 1 auto;
    min-height: 0;
}
#contentLayout > #messages { min-width: 0; }
#participantsPanel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-left: 1px solid var(--line);
    background: #1d2026;
}
.participant-panel-head {
    flex: 0 0 auto;
    padding: 14px;
    border-bottom: 1px solid var(--line);
}
.participant-panel-title { font-size: 18px; font-weight: 800; }
.participant-panel-subtitle { margin-top: 5px; font-size: 12px; color: var(--muted); line-height: 1.5; }
#participantSummary { margin-top: 9px; font-size: 12px; color: var(--green); }
#participantStatus { margin-top: 5px; font-size: 12px; color: var(--muted); line-height: 1.4; }
#participantStatus[data-kind="error"] { color: var(--red); }
#participantsList { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px; }
.participant-group { margin-bottom: 16px; }
.participant-group-title {
    margin: 0 0 7px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 800;
}
.participant-card {
    margin-bottom: 7px;
    padding: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
}
.participant-card[data-state="chat"] { border-left: 4px solid #82c8ff; }
.participant-card[data-state="queue"] { border-left: 4px solid #ffd66b; }
.participant-card[data-state="playing"] { border-left: 4px solid #83e1a0; }
.participant-card[data-state="watching"] { border-left: 4px solid #cfb5ff; }
.participant-card[data-state="ended"] { opacity: .7; }
.participant-card-main { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.participant-name { min-width: 0; flex: 1 1 100px; font-weight: 800; overflow-wrap: anywhere; font-size: 14px; }
.participant-badge {
    flex: 0 0 auto;
    padding: 3px 6px;
    border-radius: 6px;
    background: #343943;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}
.participant-detail { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.participant-empty { padding: 16px 8px; color: var(--muted); font-size: 13px; text-align: center; }
@media (max-width: 800px) {
    #contentLayout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(180px, 32vh); }
    #participantsPanel { border-left: 0; border-top: 1px solid var(--line); }
    .participant-panel-head { padding: 9px 12px; }
    #participantsList { padding: 9px; }
}

@media (max-width: 650px) {
    header { align-items: flex-start; flex-direction: column; padding: 12px; }
    .header-actions { width: 100%; justify-content: flex-start; }
    #status { padding: 9px 12px; }
    #messages { padding: 10px 8px 18px; }
    .message { padding: 10px 11px; margin-bottom: 8px; }
    .message-meta { gap: 6px; }
    .message-time { font-size: 11px; }
}
</style>
</head>
<body>
<div id="app">
    <header>
        <div class="header-main">
            <h1>💬 YP-Manager コメント閲覧専用</h1>
            <div class="subtitle">共有コメントとURL参加者の状態を同時に確認できます。送信・削除操作はありません。</div>
        </div>
        <div class="header-actions">
            <button id="scrollButton" type="button">最新コメントへ</button>
            <button id="refreshButton" type="button">今すぐ更新</button>
            <a class="button" href="./index.html">YP管理画面へ</a>
            <button id="logoutButton" type="button" hidden>ログアウト</button>
        </div>
    </header>
    <div id="status" role="status" aria-live="polite">ログイン状態を確認中…</div>
    <div id="contentLayout">
        <main id="messages" aria-live="polite" aria-label="共有コメント一覧">
            <div class="empty">コメントを読み込んでいます…</div>
        </main>
        <aside id="participantsPanel" aria-label="URL参加者一覧">
            <div class="participant-panel-head">
                <div class="participant-panel-title">👥 URL参加者一覧</div>
                <div class="participant-panel-subtitle">チャットの投稿がない人も表示。待機列・参加中・観戦・チャットのみを区別します。</div>
                <div id="participantSummary">参加者を確認中…</div>
                <div id="participantStatus" role="status" aria-live="polite"></div>
            </div>
            <div id="participantsList">
                <div class="participant-empty">参加者を読み込んでいます…</div>
            </div>
        </aside>
    </div>
    <footer>コメント・URL参加者：3秒ごとに自動更新 · 読み取り専用</footer>
</div>

<div id="loginOverlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <form class="login-card" id="loginForm">
        <h2 id="loginTitle">YP-Manager</h2>
        <p>コメント閲覧ページを利用するには、Ownerアカウントでログインしてください。管理画面と同じログイン状態を利用します。</p>
        <label for="emailInput">メールアドレス</label>
        <input id="emailInput" type="email" autocomplete="username" required>
        <label for="passwordInput">パスワード</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">ログイン</button>
        <div id="loginMessage" role="status" aria-live="polite"></div>
    </form>
</div>
<div id="imageOverlay" aria-label="画像を閉じる">
    <img id="expandedImage" alt="拡大画像">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./queue-rules.js?v=20261112-comments"></script>
<script>
"use strict";

const SUPABASE_URL = "https://ilmiebokwfccybrtduxy.supabase.co";
const SUPABASE_KEY = "sb_publishable_tl-vkXmtiYn_f1VtPy689A_dwKCdYg5";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusElement = document.getElementById("status");
const messagesElement = document.getElementById("messages");
const participantsListElement = document.getElementById("participantsList");
const participantSummaryElement = document.getElementById("participantSummary");
const participantStatusElement = document.getElementById("participantStatus");
const loginOverlay = document.getElementById("loginOverlay");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginMessage = document.getElementById("loginMessage");
const logoutButton = document.getElementById("logoutButton");
const refreshButton = document.getElementById("refreshButton");
const scrollButton = document.getElementById("scrollButton");
const imageOverlay = document.getElementById("imageOverlay");
const expandedImage = document.getElementById("expandedImage");

let ownerProfile = null;
let currentSessionId = null;
let loading = false;
let lastSignature = "";
let firstRender = true;
let lastParticipantsSignature = "";
let authCheckInProgress = false;

function setStatus(text, kind = "") {
    statusElement.textContent = text;
    statusElement.dataset.kind = kind;
}

function showLogin(message = "") {
    loginOverlay.style.display = "flex";
    loginMessage.textContent = message;
    logoutButton.hidden = true;
}

function hideLogin() {
    loginOverlay.style.display = "none";
    loginMessage.textContent = "";
}

async function verifyOwner(user) {
    if (!user?.id) return null;
    const { data, error } = await client
        .from("admin_users")
        .select("user_id, role, display_name")
        .eq("user_id", user.id)
        .maybeSingle();
    if (error) throw error;
    return data?.role === "owner" ? data : null;
}

async function initializeAuth() {
    if (authCheckInProgress) return;
    authCheckInProgress = true;
    try {
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        const user = data.session?.user;
        if (!user) {
            ownerProfile = null;
            showLogin();
            setStatus("ログインしてください");
            return;
        }
        const profile = await verifyOwner(user);
        if (!profile) {
            await client.auth.signOut({ scope: "local" });
            ownerProfile = null;
            showLogin("Owner権限のあるアカウントでログインしてください。");
            setStatus("Owner権限を確認できませんでした", "error");
            return;
        }
        ownerProfile = profile;
        hideLogin();
        logoutButton.hidden = false;
        setStatus(`ログイン中：${profile.display_name || "Owner"} · 配信を確認中…`);
        await refreshMessages(true);
    } catch (error) {
        console.error("認証確認エラー:", error);
        showLogin("ログイン状態を確認できませんでした。もう一度ログインしてください。");
        setStatus("認証エラー", "error");
    } finally {
        authCheckInProgress = false;
    }
}

loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    loginButton.disabled = true;
    loginButton.textContent = "ログイン中…";
    loginMessage.textContent = "";
    try {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        const profile = await verifyOwner(data.user);
        if (!profile) {
            await client.auth.signOut({ scope: "local" });
            throw new Error("Owner権限のあるアカウントでログインしてください。");
        }
        ownerProfile = profile;
        hideLogin();
        logoutButton.hidden = false;
        setStatus(`ログイン中：${profile.display_name || "Owner"} · 配信を確認中…`);
        await refreshMessages(true);
    } catch (error) {
        console.error("ログインエラー:", error);
        loginMessage.textContent = error.message || "ログインできませんでした。";
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "ログイン";
    }
});

logoutButton.addEventListener("click", async () => {
    await client.auth.signOut({ scope: "local" });
    ownerProfile = null;
    currentSessionId = null;
    lastSignature = "";
    clearParticipants("ログアウトしました");
    messagesElement.replaceChildren(makeEmpty("ログアウトしました"));
    showLogin();
    setStatus("ログインしてください");
});

client.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") {
        ownerProfile = null;
        currentSessionId = null;
        clearParticipants("ログインしてください");
        messagesElement.replaceChildren(makeEmpty("ログインしてください"));
        showLogin();
        setStatus("ログインしてください");
    }
});

function makeEmpty(text) {
    const element = document.createElement("div");
    element.className = "empty";
    element.textContent = text;
    return element;
}

function formatTime(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}

function normalizeName(value) {
    return String(value || "").trim();
}

async function getCurrentSessionId() {
    const { data, error } = await client
        .from("app_settings")
        .select("value")
        .eq("key", "current_session_id")
        .maybeSingle();
    if (error) throw error;
    return data?.value ? String(data.value).trim() : null;
}

async function getRoomModerators(sessionId) {
    const { data, error } = await client
        .from("rooms")
        .select("moderator_name, is_active")
        .eq("session_id", sessionId)
        .eq("is_active", true);
    if (error) {
        console.warn("部屋主情報を取得できませんでした:", error);
        return new Set();
    }
    return new Set((data || []).map(row => normalizeName(row.moderator_name)).filter(Boolean));
}

// ============================================================
// URL参加者一覧（読み取り専用）
// YP-Manager本体と同じ queue-rules.js によるチャット専用・待機列判定。
// 状態の表示だけを行い、参加者の更新や移動は行わない。
// ============================================================

function clearParticipants(message) {
    lastParticipantsSignature = "";
    participantSummaryElement.textContent = "URL参加者：--";
    participantStatusElement.textContent = "";
    participantStatusElement.dataset.kind = "";
    const empty = document.createElement("div");
    empty.className = "participant-empty";
    empty.textContent = message;
    participantsListElement.replaceChildren(empty);
}

function isChatOnlyParticipant(person) {
    if (window.YPQueueRules?.isChatOnlyPerson) {
        return window.YPQueueRules.isChatOnlyPerson(person);
    }
    const status = String(person?.status || "").toLowerCase();
    const lobby = String(person?.lobby_state || "").toLowerCase();
    const note = String(person?.note || "").toLowerCase();
    return person?.chat_only === true || status === "chat_only" ||
        lobby === "chat_only" || person?.source === "chat" ||
        note === "chat_only" ||
        (status === "viewer" && note === "viewer" && lobby !== "watching");
}

function getParticipantState(person) {
    const status = String(person.status || "").toLowerCase();
    const lobby = String(person.lobby_state || "").toLowerCase();
    const hasRoom = person.room_id !== null &&
        person.room_id !== undefined && String(person.room_id).trim() !== "";

    // 終了済みの人を、過去のチャット専用フラグで参加中扱いしない。
    if (status === "cancelled") return { key: "cancelled", label: "🔴 辞退", group: "終了・辞退", rank: 8 };
    if (status === "finished") return { key: "finished", label: "✅ 参加終了", group: "終了・辞退", rank: 8 };
    if (isChatOnlyParticipant(person)) return { key: "chat", label: "💬 チャットのみ", group: "チャットのみ", rank: 5 };
    if (lobby === "watching" || status === "viewer") return { key: "watching", label: "👀 観戦中", group: "観戦中", rank: 2 };
    if (lobby === "playing" || status === "playing") return { key: "playing", label: "🎮 参加中", group: "参加中", rank: 1 };
    if (lobby === "exchange" || (Number.isFinite(Number(person.match_count)) && Number(person.match_count) >= 2)) {
        return { key: "exchange", label: "🔄 交代待ち", group: "交代待ち", rank: 6 };
    }
    if (status === "waiting" && hasRoom) {
        return { key: "room", label: "🏠 部屋で待機", group: "部屋で待機中", rank: 3 };
    }
    if (status === "waiting") return { key: "queue", label: "⏳ 待機列", group: "待機列", rank: 0 };
    return { key: "unknown", label: "❔ 状態確認中", group: "その他", rank: 7 };
}

function isUrlParticipant(person) {
    const source = String(person.source || "").trim().toLowerCase();
    const userId = String(person.user_id || "").trim().toLowerCase();
    return source === "url" || userId.startsWith("url-");
}

function makeParticipantNode(person, state, queueRanks) {
    const card = document.createElement("div");
    card.className = "participant-card";
    card.dataset.state = state.rank >= 8 ? "ended" : state.key;

    const main = document.createElement("div");
    main.className = "participant-card-main";

    const name = document.createElement("span");
    name.className = "participant-name";
    name.textContent = normalizeName(person.name) || "名前不明";

    const badge = document.createElement("span");
    badge.className = "participant-badge";
    badge.textContent = state.label;
    main.append(name, badge);

    const details = [];
    const queueRank = queueRanks.get(String(person.id));
    if (queueRank && state.key === "queue") {
        details.push(`待機${queueRank}番目`);
    }
    if (["playing", "watching", "exchange", "room", "queue", "finished"].includes(state.key)) {
        const matchCount = Number(person.match_count);
        if (Number.isFinite(matchCount) && matchCount >= 0) {
            details.push(`プレイ${Math.floor(matchCount)}試合`);
        }
    }
    if (person.joined_at) {
        details.push(`${formatTime(person.joined_at)}登録`);
    }
    if (details.length) {
        const detail = document.createElement("div");
        detail.className = "participant-detail";
        detail.textContent = details.join(" · ");
        card.append(main, detail);
    } else {
        card.appendChild(main);
    }
    return card;
}

function renderUrlParticipants(allParticipants) {
    // 順番の判定には通常参加者も含む待機列全体を利用する。
    // 表示する名前はURL参加者だけに絞る。
    const queueRules = window.YPQueueRules;
    const orderedWaiting = queueRules?.sortMainWaiting
        ? queueRules.sortMainWaiting(allParticipants)
        : allParticipants
            .filter(person => person.status === "waiting" && !person.room_id && !isChatOnlyParticipant(person))
            .sort((a, b) => (Number(a.display_order) || 0) - (Number(b.display_order) || 0));
    const queueRanks = new Map(orderedWaiting.map((person, index) => [String(person.id), index + 1]));

    // 同じURL利用者がいったん辞退して再登録した場合、古い行を二重表示しない。
    // 名前ではなくブラウザごとの user_id を基準にする（同名の別人は残す）。
    const latestByUrlUser = new Map();
    for (const person of allParticipants.filter(isUrlParticipant)) {
        const userId = String(person.user_id || "").trim();
        const key = userId ? `user:${userId}` : `row:${person.id}`;
        const previous = latestByUrlUser.get(key);
        if (!previous || String(person.joined_at || "") >= String(previous.joined_at || "")) {
            latestByUrlUser.set(key, person);
        }
    }

    const urlParticipants = [...latestByUrlUser.values()]
        .map(person => ({ person, state: getParticipantState(person) }))
        .sort((a, b) => a.state.rank - b.state.rank ||
            ((queueRanks.get(String(a.person.id)) || 999999) - (queueRanks.get(String(b.person.id)) || 999999)) ||
            String(a.person.joined_at || "").localeCompare(String(b.person.joined_at || "")));

    const signature = JSON.stringify({
        urlParticipants: urlParticipants.map(({ person, state }) => [
            person.id, person.name, state.key, person.display_order,
            person.room_id, person.match_count, person.joined_at,
            queueRanks.get(String(person.id)) || null
        ])
    });

    const activeCount = urlParticipants.filter(({ state }) => state.rank < 8).length;
    const chatCount = urlParticipants.filter(({ state }) => state.key === "chat").length;
    const waitingCount = urlParticipants.filter(({ state }) => state.key === "queue").length;
    participantSummaryElement.textContent = `現在${activeCount}人（待機列${waitingCount}人・チャットのみ${chatCount}人）`;
    participantStatusElement.textContent = `配信内のURL登録：累計${urlParticipants.length}人`;
    participantStatusElement.dataset.kind = "";

    if (signature === lastParticipantsSignature) return;
    lastParticipantsSignature = signature;
    const oldScrollTop = participantsListElement.scrollTop;
    const fragment = document.createDocumentFragment();
    if (urlParticipants.length === 0) {
        const empty = document.createElement("div");
        empty.className = "participant-empty";
        empty.textContent = "現在の配信にURL参加者はいません";
        fragment.appendChild(empty);
    } else {
        let group = "";
        let groupContainer = null;
        for (const { person, state } of urlParticipants) {
            if (state.group !== group) {
                group = state.group;
                const section = document.createElement("section");
                section.className = "participant-group";
                const title = document.createElement("h2");
                title.className = "participant-group-title";
                title.textContent = group;
                section.appendChild(title);
                groupContainer = section;
                fragment.appendChild(section);
            }
            groupContainer.appendChild(makeParticipantNode(person, state, queueRanks));
        }
    }
    participantsListElement.replaceChildren(fragment);
    participantsListElement.scrollTop = oldScrollTop;
}

async function refreshUrlParticipants(sessionId) {
    try {
        // 全参加者を取得して待機順位を計算する（表示はURL参加者のみ）。
        const { data, error } = await client
            .from("participants")
            .select("id,name,user_id,source,status,lobby_state,chat_only,note,room_id,display_order,joined_at,match_count,first_participation_pending")
            .eq("session_id", sessionId)
            .order("joined_at", { ascending: true });
        if (error) throw error;
        if (currentSessionId !== sessionId || !ownerProfile) return;
        if (window.YPQueueRules?.refreshHostName) {
            await window.YPQueueRules.refreshHostName(client);
        }
        if (currentSessionId === sessionId && ownerProfile) {
            renderUrlParticipants(Array.isArray(data) ? data : []);
        }
    } catch (error) {
        console.error("URL参加者取得エラー:", error);
        if (currentSessionId === sessionId && ownerProfile) {
            participantStatusElement.textContent = `参加者の取得に失敗：${error.message || "通信エラー"}`;
            participantStatusElement.dataset.kind = "error";
        }
    }
}

function messageClass(item, roomModerators) {
    if (item.is_deleted) return "message deleted";
    if (item.sender_type === "owner") return "message owner";
    if (item.sender_type === "moderator" && roomModerators.has(normalizeName(item.participant_name))) return "message room-admin";
    if (item.sender_type === "moderator") return "message moderator";
    return "message";
}

function messageSender(item, roomModerators) {
    const name = normalizeName(item.participant_name);
    if (item.sender_type === "owner") return `👑 ${name || "Owner"}（Owner）`;
    if (item.sender_type === "moderator" && roomModerators.has(name)) return `🏠 ${name || "管理者"}（部屋主）`;
    if (item.sender_type === "moderator") return `🛡 ${name || "Moderator"}（Moderator）`;
    return name || "名前不明";
}

function renderMessages(messages, roomModerators) {
    const signature = JSON.stringify(messages.map(item => [
        item.message_id, item.sent_at, item.is_deleted, item.deleted_at,
        item.message_text || "", item.image_url || "", item.image_path || ""
    ]));
    if (signature === lastSignature) return;

    const wasNearBottom = messagesElement.scrollHeight - messagesElement.scrollTop - messagesElement.clientHeight < 100;
    lastSignature = signature;
    const fragment = document.createDocumentFragment();

    if (!messages.length) {
        fragment.appendChild(makeEmpty("まだメッセージはありません"));
    } else {
        for (const item of messages) {
            const card = document.createElement("article");
            card.className = messageClass(item, roomModerators);

            const meta = document.createElement("div");
            meta.className = "message-meta";
            const name = document.createElement("div");
            name.className = "message-name";
            name.textContent = messageSender(item, roomModerators);
            const time = document.createElement("time");
            time.className = "message-time";
            time.textContent = formatTime(item.sent_at);
            meta.append(name, time);
            card.appendChild(meta);

            const text = document.createElement("div");
            text.className = "message-text";
            text.textContent = item.is_deleted
                ? (item.message_text || "このメッセージは削除されました")
                : (item.message_text || "");
            if (text.textContent) card.appendChild(text);

            if (item.is_deleted) {
                const deleted = document.createElement("div");
                deleted.className = "deleted-note";
                deleted.textContent = `削除済み${item.deleted_by_name ? `（${item.deleted_by_name}）` : ""}`;
                card.appendChild(deleted);
            } else if (item.image_url) {
                const image = document.createElement("img");
                image.className = "message-image";
                image.src = item.image_url;
                image.alt = "コメント画像";
                image.loading = "lazy";
                image.decoding = "async";
                image.addEventListener("click", () => {
                    expandedImage.src = item.image_url;
                    imageOverlay.style.display = "flex";
                });
                card.appendChild(image);
            }
            fragment.appendChild(card);
        }
    }

    messagesElement.replaceChildren(fragment);
    if (firstRender || wasNearBottom) messagesElement.scrollTop = messagesElement.scrollHeight;
    firstRender = false;
}

async function refreshMessages(force = false) {
    if (loading || !ownerProfile || document.hidden) return;
    loading = true;
    refreshButton.disabled = true;
    try {
        const sessionId = await getCurrentSessionId();
        if (!sessionId) {
            currentSessionId = null;
            lastSignature = "";
            clearParticipants("現在受付中の配信はありません");
            messagesElement.replaceChildren(makeEmpty("現在受付中の配信はありません"));
            setStatus("現在受付中の配信はありません");
            return;
        }
        if (currentSessionId !== sessionId) {
            lastSignature = "";
            lastParticipantsSignature = "";
            firstRender = true;
            clearParticipants("参加者情報を読み込んでいます…");
        }
        currentSessionId = sessionId;
        // 参加者読み込みはコメントRPCと独立。どちらかの失敗で他方を止めない。
        const participantPromise = refreshUrlParticipants(sessionId);
        const [messageResult, roomModerators] = await Promise.all([
            client.rpc("get_participant_messages", { p_session_id: sessionId }),
            getRoomModerators(sessionId)
        ]);
        if (messageResult.error) throw messageResult.error;
        if (!ownerProfile || currentSessionId !== sessionId) return;
        const messages = Array.isArray(messageResult.data) ? messageResult.data : [];
        messages.sort((a, b) => new Date(a.sent_at || 0) - new Date(b.sent_at || 0));
        renderMessages(messages, roomModerators);
        const latest = messages.length ? formatTime(messages[messages.length - 1].sent_at) : "--:--";
        setStatus(`配信ID：${sessionId}　｜　共有コメント ${messages.length}件　｜　最新 ${latest}`, "ok");
        await participantPromise;
    } catch (error) {
        console.error("コメント取得エラー:", error);
        setStatus(`コメントを取得できませんでした：${error.message || "詳細はコンソールを確認してください"}`, "error");
        if (force) messagesElement.replaceChildren(makeEmpty("コメント取得に失敗しました。認証とデータベース権限を確認してください。"));
    } finally {
        loading = false;
        refreshButton.disabled = false;
    }
}

refreshButton.addEventListener("click", () => refreshMessages(true));
scrollButton.addEventListener("click", () => {
    messagesElement.scrollTo({ top: messagesElement.scrollHeight, behavior: "smooth" });
});
imageOverlay.addEventListener("click", () => {
    imageOverlay.style.display = "none";
    expandedImage.removeAttribute("src");
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape") imageOverlay.click();
});

document.addEventListener("visibilitychange", () => {
    if (!document.hidden && ownerProfile) refreshMessages(true);
});

initializeAuth();
setInterval(() => refreshMessages(false), 3000);
</script>
</body>
</html>
